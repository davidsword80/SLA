<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solo Leveling Arise - Actualités</title>
    <link rel="stylesheet" href="css/fusion.css" />
    <link rel="shortcut icon" href="img/Icon/20x20.png" />
    <script src="js/components.js"></script>
    <style>
      /* Style spécifique pour la liste d'actus pour qu'elle prenne toute la largeur */
      .actu-list {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        max-width: 800px;
        margin: 0 auto;
      }
      .actu-item {
        background-color: #1a1a1a;
        border: 1px solid red;
        border-radius: 8px;
        padding: 15px 20px;
        width: 100%;
        text-align: left;
        transition: transform 0.2s;
      }
      .actu-item:hover {
        transform: scale(1.02);
        background-color: #2c2c2c;
      }
      .actu-item a {
        text-decoration: none;
        color: white;
        display: block;
      }
      .actu-item h4 {
        margin: 0;
        color: red;
      }
    </style>
  </head>
  <body>
    <main>
      <h2 style="margin-bottom: 30px;">Dernières Mises à Jour (Forum Officiel)</h2>
      
      <section id="news-container" class="actu-list">
        </section>
      
    </main>
    <script src="js/actus_data.js"></script>
    <script src="js/actu.js"></script>    
  </body>
</html>
