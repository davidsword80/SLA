<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer Couleurs</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            transition: background-color 0.5s ease-in-out; /* Transition pour le fond */
        }
        h1 {
            transition: color 0.5s ease-in-out; /* Transition pour le texte */
        }
        input, button {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1 id="titre">Texte qui change de couleur</h1>
    
    <input type="text" id="couleurInput" placeholder="Entrez une couleur">
    <button onclick="changerTexte()">Changer le texte</button>
    <button onclick="changerFond()">Changer le fond</button>

    <script>
        function changerTexte() {
            let couleur = document.getElementById("couleurInput").value;
            document.getElementById("titre").style.color = couleur;
        }

        function changerFond() {
            let couleur = document.getElementById("couleurInput").value;
            document.body.style.backgroundColor = couleur;
        }
    </script>

</body>
</html>
