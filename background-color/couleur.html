<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer les couleurs</title>
    <style>
        body {
            background-color: white; /* Fond par défaut */
            color: black; /* Texte par défaut */
            text-align: center;
            font-family: Arial, sans-serif;
            transition: 2s; /* Animation fluide */
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1 id="titre">Texte qui change de couleur</h1>
    <button onclick="modeSombre()">🌙 Mode Sombre</button>
    <button onclick="modeClair()">☀️ Mode Clair</button>

    <script>
        function modeSombre() {
            document.body.style.backgroundColor = "black";
            document.getElementById("titre").style.color = "purple";
        }

        function modeClair() {
            document.body.style.backgroundColor = "white";
            document.getElementById("titre").style.color = "blue";
        }
    </script>

</body>
</html>
