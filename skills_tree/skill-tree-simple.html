<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compétences de Base</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .left-panel {
            flex: 1;
        }

        .header {
            background: #1a1a1a;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .header h1 {
            font-size: 24px;
            color: #4dd9e8;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .skill-card {
            background: #1a1a1a;
            border: 2px solid #333;
            padding: 20px;
            cursor: pointer;
        }

        .skill-card:hover {
            border-color: #4dd9e8;
        }

        .skill-card.active {
            border-color: #f4c430;
            background: #222;
        }

        .skill-icon {
            font-size: 60px;
            text-align: center;
            margin-bottom: 15px;
        }

        .skill-name {
            font-size: 16px;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .skill-level {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .skill-dots {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            border: 1px solid #555;
        }

        .dot.active {
            background: #4dd9e8;
        }

        .sub-skills {
            margin-top: 15px;
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .sub-skills.show {
            display: grid;
        }

        .sub-skill {
            background: #2a2a2a;
            border: 1px solid #f4c430;
            padding: 15px 10px;
            cursor: pointer;
            text-align: center;
        }

        .sub-skill:hover {
            background: #333;
        }

        .sub-skill-icon {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .sub-skill-label {
            font-size: 11px;
            color: #ccc;
        }

        .right-panel {
            flex: 0 0 400px;
        }

        .description-card {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 25px;
            min-height: 400px;
        }

        .description-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .description-icon {
            font-size: 50px;
            text-align: center;
            margin-bottom: 15px;
        }

        .description-title h2 {
            font-size: 22px;
            color: #f4c430;
            margin-bottom: 8px;
        }

        .description-level {
            color: #888;
            font-size: 14px;
        }

        .description-content {
            font-size: 15px;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 20px;
        }

        .description-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-item {
            background: #0a0a0a;
            padding: 12px;
            border: 1px solid #222;
        }

        .stat-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #4dd9e8;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        .empty-state-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty-state-text {
            font-size: 16px;
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            .right-panel {
                flex: 1;
            }
        }

        @media (max-width: 768px) {
            .skills-grid {
                grid-template-columns: 1fr;
            }
            .sub-skills {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="header">
                <h1>Compétences de Base</h1>
            </div>

            <div class="skills-grid" id="skillsGrid"></div>
        </div>

        <div class="right-panel">
            <div class="description-card" id="descriptionCard">
                <div class="empty-state">
                    <div class="empty-state-icon">🎯</div>
                    <div class="empty-state-text">Sélectionnez une compétence pour voir les détails</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const skillsData = [
            {
                id: 1,
                name: "Tornade Cyclonique",
                icon: "🌪️",
                level: 22,
                dots: 3,
                activeDots: 2,
                description: "Invoque une puissante tornade qui balaye tous les ennemis sur son passage. Les dégâts augmentent avec la durée du channeling.",
                stats: { power: "450%", cooldown: "8s", range: "12m", duration: "4s" },
                subSkills: [
                    { icon: "🌀", label: "E" },
                    { icon: "🌀", label: "Basic" },
                    { icon: "🌀", label: "Advanced" },
                    { icon: "🌀", label: "Master" }
                ]
            },
            {
                id: 2,
                name: "Éclair Foudroyant",
                icon: "⚡",
                level: 21,
                dots: 3,
                activeDots: 2,
                description: "Lance un éclair dévastateur qui traverse plusieurs ennemis. Chaque ennemi touché augmente les dégâts de 15%.",
                stats: { power: "320%", cooldown: "6s", range: "15m", pierce: "5" },
                subSkills: [
                    { icon: "⚡", label: "Base" },
                    { icon: "💫", label: "Enhanced" }
                ]
            },
            {
                id: 3,
                name: "Griffes Spectrales",
                icon: "👻",
                level: 22,
                dots: 3,
                activeDots: 3,
                description: "Matérialise des griffes fantomatiques qui lacèrent les ennemis proches. Inflige des dégâts continus pendant 6 secondes.",
                stats: { power: "280%", cooldown: "12s", range: "8m", dot: "40%/s" },
                subSkills: [
                    { icon: "👻", label: "Phase 1" },
                    { icon: "💀", label: "Phase 2" }
                ]
            },
            {
                id: 4,
                name: "Lames Tourbillonnantes",
                icon: "🗡️",
                level: 21,
                dots: 3,
                activeDots: 2,
                description: "Fait tournoyer des lames d'énergie autour du lanceur, repoussant les ennemis et les blessant gravement.",
                stats: { power: "380%", cooldown: "10s", range: "6m", knockback: "High" },
                subSkills: [
                    { icon: "🗡️", label: "Spin" },
                    { icon: "⚔️", label: "Fury" },
                    { icon: "🌟", label: "Ultimate" }
                ]
            },
            {
                id: 5,
                name: "Croix Arcanique",
                icon: "✖️",
                level: 22,
                dots: 3,
                activeDots: 2,
                description: "Projette une croix d'énergie magique qui explose au contact. Les explosions se propagent aux ennemis proches.",
                stats: { power: "500%", cooldown: "15s", range: "20m", aoe: "8m" },
                subSkills: [
                    { icon: "✖️", label: "Cross" },
                    { icon: "💥", label: "Explosion" },
                    { icon: "🌠", label: "Chain" }
                ]
            },
            {
                id: 6,
                name: "Ombre Furtive",
                icon: "🌑",
                level: 21,
                dots: 3,
                activeDots: 1,
                description: "Vous transforme en ombre, augmentant votre vitesse de déplacement de 60% et vous rendant immunisé aux dégâts pendant 3 secondes.",
                stats: { power: "0%", cooldown: "20s", duration: "3s", speed: "+60%" },
                subSkills: [
                    { icon: "🌑", label: "Stealth" }
                ]
            },
            {
                id: 7,
                name: "Salve Stellaire",
                icon: "✨",
                level: 22,
                dots: 3,
                activeDots: 3,
                description: "Tire une rafale d'étoiles filantes qui poursuivent automatiquement les ennemis les plus proches.",
                stats: { power: "220%", cooldown: "5s", range: "18m", projectiles: "8" },
                subSkills: [
                    { icon: "✨", label: "Basic" },
                    { icon: "⭐", label: "Seeking" },
                    { icon: "💫", label: "Nova" }
                ]
            },
            {
                id: 8,
                name: "Frappe Éclair",
                icon: "⚡",
                level: 22,
                dots: 3,
                activeDots: 2,
                description: "Dash rapide qui traverse les ennemis en leur infligeant des dégâts électriques. Réinitialise le cooldown si vous éliminez un ennemi.",
                stats: { power: "340%", cooldown: "7s", range: "10m", reset: "Yes" },
                subSkills: [
                    { icon: "⚡", label: "Dash" },
                    { icon: "💨", label: "Speed" },
                    { icon: "🔆", label: "Power" }
                ]
            },
            {
                id: 9,
                name: "Éruption Volcanique",
                icon: "🌋",
                level: 22,
                dots: 3,
                activeDots: 2,
                description: "Fait jaillir des geysers de lave du sol qui brûlent continuellement les ennemis. Crée une zone de contrôle durable.",
                stats: { power: "400%", cooldown: "18s", range: "10m", duration: "8s" },
                subSkills: [
                    { icon: "🌋", label: "Eruption" },
                    { icon: "🔥", label: "Inferno" }
                ]
            },
            {
                id: 10,
                name: "Tempête de Lames",
                icon: "⚔️",
                level: 22,
                dots: 3,
                activeDots: 3,
                description: "Conjure des dizaines de lames spectrales qui frappent aléatoirement dans une large zone. Effet dévastateur en groupe.",
                stats: { power: "180%", cooldown: "14s", range: "15m", hits: "20" },
                subSkills: [
                    { icon: "⚔️", label: "Storm" },
                    { icon: "🗡️", label: "Fury" },
                    { icon: "⚡", label: "Thunder" }
                ]
            },
            {
                id: 11,
                name: "Nova Glaciale",
                icon: "❄️",
                level: 22,
                dots: 3,
                activeDots: 2,
                description: "Libère une explosion de glace qui gèle tous les ennemis dans un large rayon et leur inflige des dégâts massifs.",
                stats: { power: "520%", cooldown: "16s", range: "12m", freeze: "3s" },
                subSkills: [
                    { icon: "❄️", label: "Frost" },
                    { icon: "🧊", label: "Freeze" },
                    { icon: "💎", label: "Shatter" }
                ]
            },
            {
                id: 12,
                name: "Impulsion Cosmique",
                icon: "🌟",
                level: 22,
                dots: 3,
                activeDots: 3,
                description: "Concentre l'énergie cosmique pour créer une onde de choc dévastatrice. Plus vous chargez, plus les dégâts sont importants.",
                stats: { power: "600%", cooldown: "22s", range: "25m", charge: "3s" },
                subSkills: [
                    { icon: "🌟", label: "Pulse" },
                    { icon: "💫", label: "Charge" },
                    { icon: "✨", label: "Release" }
                ]
            }
        ];

        function createSkillCards() {
            const grid = document.getElementById('skillsGrid');
            
            skillsData.forEach(skill => {
                const card = document.createElement('div');
                card.className = 'skill-card';
                card.dataset.skillId = skill.id;
                
                const dots = Array.from({ length: skill.dots }, (_, i) => 
                    `<div class="dot ${i < skill.activeDots ? 'active' : ''}"></div>`
                ).join('');
                
                card.innerHTML = `
                    <div class="skill-icon">${skill.icon}</div>
                    <div class="skill-name">${skill.name}</div>
                    <div class="skill-level">Niv. ${skill.level}</div>
                    <div class="skill-dots">${dots}</div>
                    <div class="sub-skills" id="subSkills${skill.id}">
                        ${skill.subSkills.map(sub => `
                            <div class="sub-skill" data-skill-id="${skill.id}">
                                <div class="sub-skill-icon">${sub.icon}</div>
                                <div class="sub-skill-label">${sub.label}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.sub-skill')) {
                        toggleSkill(skill.id);
                    }
                });
                
                grid.appendChild(card);
            });

            document.querySelectorAll('.sub-skill').forEach(subSkill => {
                subSkill.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const skillId = parseInt(subSkill.dataset.skillId);
                    showSkillDescription(skillId);
                });
            });
        }

        function toggleSkill(skillId) {
            const card = document.querySelector(`[data-skill-id="${skillId}"]`);
            const subSkills = document.getElementById(`subSkills${skillId}`);
            const allCards = document.querySelectorAll('.skill-card');
            const allSubSkills = document.querySelectorAll('.sub-skills');
            
            if (card.classList.contains('active')) {
                card.classList.remove('active');
                subSkills.classList.remove('show');
                showEmptyState();
            } else {
                allCards.forEach(c => c.classList.remove('active'));
                allSubSkills.forEach(s => s.classList.remove('show'));
                
                card.classList.add('active');
                subSkills.classList.add('show');
                
                showSkillDescription(skillId);
            }
        }

        function showSkillDescription(skillId) {
            const skill = skillsData.find(s => s.id === skillId);
            const descCard = document.getElementById('descriptionCard');
            
            descCard.innerHTML = `
                <div class="description-header">
                    <div class="description-icon">${skill.icon}</div>
                    <div class="description-title">
                        <h2>${skill.name}</h2>
                        <div class="description-level">Niveau ${skill.level}</div>
                    </div>
                </div>
                <div class="description-content">
                    ${skill.description}
                </div>
                <div class="description-stats">
                    ${Object.entries(skill.stats).map(([key, value]) => `
                        <div class="stat-item">
                            <div class="stat-label">${key}</div>
                            <div class="stat-value">${value}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function showEmptyState() {
            const descCard = document.getElementById('descriptionCard');
            descCard.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🎯</div>
                    <div class="empty-state-text">Sélectionnez une compétence pour voir les détails</div>
                </div>
            `;
        }

        createSkillCards();
    </script>
</body>
</html>
