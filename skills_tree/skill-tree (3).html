<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compétences de Base</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #0a1628;
            --bg-mid: #1a2942;
            --bg-card: #243554;
            --accent-cyan: #4dd9e8;
            --accent-gold: #f4c430;
            --accent-red: #d32f2f;
            --accent-green: #7cb342;
            --accent-purple: #9c27b0;
            --text-primary: #e8f4f8;
            --text-secondary: #8fa3b8;
            --glow-cyan: rgba(77, 217, 232, 0.5);
            --glow-gold: rgba(244, 196, 48, 0.5);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, var(--bg-deep) 0%, #0d1f3a 50%, var(--bg-deep) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(77, 217, 232, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(244, 196, 48, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 20px;
            gap: 40px;
        }

        .left-panel {
            flex: 1;
            max-width: 900px;
        }

        .header {
            background: linear-gradient(135deg, rgba(26, 41, 66, 0.6) 0%, rgba(36, 53, 84, 0.4) 100%);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 50px;
            border: 2px solid rgba(77, 217, 232, 0.3);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .header-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--accent-cyan), #2a9bb8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 20px var(--glow-cyan);
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent-cyan), white);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 800px;
        }

        .skill-card {
            position: relative;
            background: linear-gradient(135deg, rgba(36, 53, 84, 0.4), rgba(26, 41, 66, 0.6));
            border: 2px solid rgba(77, 217, 232, 0.2);
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            overflow: visible;
            display: flex;
            flex-direction: column;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(77, 217, 232, 0.1) 50%,
                transparent 70%
            );
            transform: rotate(45deg);
            transition: all 0.6s;
        }

        .skill-card:hover::before {
            left: 100%;
        }

        .skill-card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: var(--accent-cyan);
            box-shadow: 0 15px 50px rgba(77, 217, 232, 0.3);
        }

        .skill-card.active {
            border-color: var(--accent-gold);
            background: linear-gradient(135deg, rgba(244, 196, 48, 0.15), rgba(36, 53, 84, 0.6));
            box-shadow: 0 15px 50px var(--glow-gold);
        }

        .skill-icon-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
        }

        .skill-hexagon {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(26, 41, 66, 0.8), rgba(10, 22, 40, 0.9));
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(77, 217, 232, 0.4);
            transition: all 0.3s;
            position: relative;
        }

        .skill-card:hover .skill-hexagon,
        .skill-card.active .skill-hexagon {
            border-color: var(--accent-gold);
            box-shadow: inset 0 0 30px var(--glow-gold);
        }

        .skill-icon {
            font-size: 50px;
            filter: drop-shadow(0 0 10px var(--glow-cyan));
        }

        .skill-badge {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 35px;
            height: 35px;
            background: var(--accent-green);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            transform: rotate(-15deg);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .skill-badge.red { background: var(--accent-red); }
        .skill-badge.green { background: var(--accent-green); }
        .skill-badge.purple { background: var(--accent-purple); }
        .skill-badge.gold { background: var(--accent-gold); color: #000; }

        .skill-level {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .skill-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(77, 217, 232, 0.3);
            border: 1px solid rgba(77, 217, 232, 0.5);
        }

        .dot.active {
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--glow-cyan);
        }

        .sub-skills {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sub-skills.show {
            opacity: 1;
            max-height: 1000px;
        }

        .sub-skill {
            position: relative;
            background: linear-gradient(135deg, rgba(244, 196, 48, 0.2), rgba(244, 196, 48, 0.05));
            border: 2px solid rgba(244, 196, 48, 0.4);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .sub-skill:hover {
            transform: scale(1.1);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 30px var(--glow-gold);
            z-index: 10;
        }

        .sub-skill-icon {
            font-size: 28px;
            margin-bottom: 6px;
            filter: drop-shadow(0 0 8px var(--glow-gold));
        }

        .sub-skill-label {
            font-size: 10px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 3px 6px;
            border-radius: 6px;
        }

        .right-panel {
            flex: 0 0 400px;
            position: sticky;
            top: 40px;
            height: fit-content;
        }

        .description-card {
            background: linear-gradient(135deg, rgba(36, 53, 84, 0.6), rgba(26, 41, 66, 0.8));
            backdrop-filter: blur(15px);
            border: 2px solid rgba(77, 217, 232, 0.3);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            min-height: 400px;
        }

        .description-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(77, 217, 232, 0.2);
        }

        .description-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(26, 41, 66, 0.8), rgba(10, 22, 40, 0.9));
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 25px var(--glow-gold);
        }

        .description-title {
            flex: 1;
        }

        .description-title h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent-gold), white);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .description-level {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .description-content {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .description-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: rgba(10, 22, 40, 0.5);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(77, 217, 232, 0.2);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 18px;
            font-weight: 300;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .skill-card {
            animation: fadeIn 0.5s ease-out backwards;
        }

        .skill-card:nth-child(1) { animation-delay: 0.05s; }
        .skill-card:nth-child(2) { animation-delay: 0.1s; }
        .skill-card:nth-child(3) { animation-delay: 0.15s; }
        .skill-card:nth-child(4) { animation-delay: 0.2s; }
        .skill-card:nth-child(5) { animation-delay: 0.25s; }
        .skill-card:nth-child(6) { animation-delay: 0.3s; }
        .skill-card:nth-child(7) { animation-delay: 0.35s; }
        .skill-card:nth-child(8) { animation-delay: 0.4s; }
        .skill-card:nth-child(9) { animation-delay: 0.45s; }
        .skill-card:nth-child(10) { animation-delay: 0.5s; }
        .skill-card:nth-child(11) { animation-delay: 0.55s; }
        .skill-card:nth-child(12) { animation-delay: 0.6s; }

        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
            }
            .right-panel {
                position: relative;
                top: 0;
                flex: 1;
                max-width: 100%;
            }
        }

        @media (max-width: 768px) {
            .skills-grid {
                grid-template-columns: repeat(1, 1fr);
            }
            .sub-skills {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

        // Générer les étoiles
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Créer les cartes de compétences
        function createSkillCards() {
            const grid = document.getElementById('skillsGrid');
            
            skillsData.forEach(skill => {
                const card = document.createElement('div');
                card.className = 'skill-card';
                card.dataset.skillId = skill.id;
                
                const dots = Array.from({ length: skill.dots }, (_, i) => 
                    `<div class="dot ${i < skill.activeDots ? 'active' : ''}"></div>`
                ).join('');
                
                card.innerHTML = `
                    <div class="skill-icon-wrapper">
                        ${skill.badge ? `<div class="skill-badge ${skill.badge.color}">${skill.badge.text}</div>` : ''}
                        <div class="skill-hexagon">
                            <div class="skill-icon">${skill.icon}</div>
                        </div>
                    </div>
                    <div class="skill-level">Niv. ${skill.level}</div>
                    <div class="skill-dots">${dots}</div>
                    <div class="sub-skills" id="subSkills${skill.id}">
                        ${skill.subSkills.map(sub => `
                            <div class="sub-skill" data-skill-id="${skill.id}">
                                <div class="sub-skill-icon">${sub.icon}</div>
                                <div class="sub-skill-label">${sub.label}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.sub-skill')) {
                        toggleSkill(skill.id);
                    }
                });
                
                grid.appendChild(card);
            });

            // Ajouter les événements pour les sous-compétences
            document.querySelectorAll('.sub-skill').forEach(subSkill => {
                subSkill.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const skillId = parseInt(subSkill.dataset.skillId);
                    showSkillDescription(skillId);
                });
            });
        }

        // Toggle affichage des sous-compétences
        function toggleSkill(skillId) {
            const card = document.querySelector(`[data-skill-id="${skillId}"]`);
            const subSkills = document.getElementById(`subSkills${skillId}`);
            const allCards = document.querySelectorAll('.skill-card');
            const allSubSkills = document.querySelectorAll('.sub-skills');
            
            // Si on clique sur une carte déjà active, on la désactive
            if (card.classList.contains('active')) {
                card.classList.remove('active');
                subSkills.classList.remove('show');
                showEmptyState();
            } else {
                // Désactiver toutes les autres cartes
                allCards.forEach(c => c.classList.remove('active'));
                allSubSkills.forEach(s => s.classList.remove('show'));
                
                // Activer la carte cliquée
                card.classList.add('active');
                subSkills.classList.add('show');
                
                // Afficher la description
                showSkillDescription(skillId);
            }
        }

        // Afficher la description d'une compétence
        function showSkillDescription(skillId) {
            const skill = skillsData.find(s => s.id === skillId);
            const descCard = document.getElementById('descriptionCard');
            
            descCard.innerHTML = `
                <div class="description-header">
                    <div class="description-icon">${skill.icon}</div>
                    <div class="description-title">
                        <h2>${skill.name}</h2>
                        <div class="description-level">Niveau ${skill.level}</div>
                    </div>
                </div>
                <div class="description-content">
                    ${skill.description}
                </div>
                <div class="description-stats">
                    ${Object.entries(skill.stats).map(([key, value]) => `
                        <div class="stat-item">
                            <div class="stat-label">${key}</div>
                            <div class="stat-value">${value}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Afficher l'état vide
        function showEmptyState() {
            const descCard = document.getElementById('descriptionCard');
            descCard.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🎯</div>
                    <div class="empty-state-text">Sélectionnez une compétence pour voir les détails</div>
                </div>
            `;
        }

        // Initialisation
        createStars();
        createSkillCards();
    </script>
</body>
</html>
