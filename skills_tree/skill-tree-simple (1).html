<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .left-panel {
            flex: 1;
        }

        .header {
            background: #1a1a1a;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .header h1 {
            font-size: 24px;
            color: #4dd9e8;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .skill-card {
            background: #1a1a1a;
            border: 2px solid #333;
            padding: 20px;
            cursor: pointer;
        }

        .skill-card:hover {
            border-color: #4dd9e8;
        }

        .skill-card.active {
            border-color: #f4c430;
            background: #222;
        }

        .skill-icon {
            font-size: 60px;
            text-align: center;
            margin-bottom: 15px;
        }

        .skill-name {
            font-size: 16px;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .skill-level {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .skill-dots {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            border: 1px solid #555;
        }

        .dot.active {
            background: #4dd9e8;
        }

        .sub-skills {
            margin-top: 15px;
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .sub-skills.show {
            display: grid;
        }

        .sub-skill {
            background: #2a2a2a;
            border: 1px solid #f4c430;
            padding: 15px 10px;
            cursor: pointer;
            text-align: center;
        }

        .sub-skill:hover {
            background: #333;
            border-color: #4dd9e8;
        }

        .sub-skill.selected {
            background: #333;
            border-color: #4dd9e8;
            border-width: 2px;
        }

        .sub-skill-icon {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .sub-skill-label {
            font-size: 11px;
            color: #ccc;
        }

        .right-panel {
            flex: 0 0 400px;
        }

        .description-card {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 25px;
            min-height: 400px;
        }

        .description-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .description-icon {
            font-size: 50px;
            text-align: center;
            margin-bottom: 15px;
        }

        .description-title h2 {
            font-size: 22px;
            color: #f4c430;
            margin-bottom: 8px;
        }

        .description-level {
            color: #888;
            font-size: 14px;
        }

        .description-content {
            font-size: 15px;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 20px;
        }

        .description-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-item {
            background: #0a0a0a;
            padding: 12px;
            border: 1px solid #222;
        }

        .stat-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #4dd9e8;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        .empty-state-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty-state-text {
            font-size: 16px;
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            .right-panel {
                flex: 1;
            }
        }

        @media (max-width: 768px) {
            .skills-grid {
                grid-template-columns: 1fr;
            }
            .sub-skills {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>

        function createSkillCards() {
            const grid = document.getElementById('skillsGrid');
            
            skillsData.forEach(skill => {
                const card = document.createElement('div');
                card.className = 'skill-card';
                card.dataset.skillId = skill.id;
                
                const dots = Array.from({ length: skill.dots }, (_, i) => 
                    `<div class="dot ${i < skill.activeDots ? 'active' : ''}"></div>`
                ).join('');
                
                card.innerHTML = `
                    <div class="skill-icon">${skill.icon}</div>
                    <div class="skill-name">${skill.name}</div>
                    <div class="skill-level">Niv. ${skill.level}</div>
                    <div class="skill-dots">${dots}</div>
                    <div class="sub-skills" id="subSkills${skill.id}">
                        ${skill.subSkills.map((sub, index) => `
                            <div class="sub-skill" data-skill-id="${skill.id}" data-sub-index="${index}">
                                <div class="sub-skill-icon">${sub.icon}</div>
                                <div class="sub-skill-label">${sub.label}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.sub-skill')) {
                        toggleSkill(skill.id);
                    }
                });
                
                grid.appendChild(card);
            });

            document.querySelectorAll('.sub-skill').forEach(subSkill => {
                subSkill.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const skillId = parseInt(subSkill.dataset.skillId);
                    const subIndex = parseInt(subSkill.dataset.subIndex);
                    
                    // Remove selected class from all sub-skills
                    document.querySelectorAll('.sub-skill').forEach(s => s.classList.remove('selected'));
                    // Add selected class to clicked sub-skill
                    subSkill.classList.add('selected');
                    
                    showSubSkillDescription(skillId, subIndex);
                });
            });
        }

        function toggleSkill(skillId) {
            const card = document.querySelector(`[data-skill-id="${skillId}"]`);
            const subSkills = document.getElementById(`subSkills${skillId}`);
            const allCards = document.querySelectorAll('.skill-card');
            const allSubSkills = document.querySelectorAll('.sub-skills');
            
            if (card.classList.contains('active')) {
                card.classList.remove('active');
                subSkills.classList.remove('show');
                document.querySelectorAll('.sub-skill').forEach(s => s.classList.remove('selected'));
                showEmptyState();
            } else {
                allCards.forEach(c => c.classList.remove('active'));
                allSubSkills.forEach(s => s.classList.remove('show'));
                document.querySelectorAll('.sub-skill').forEach(s => s.classList.remove('selected'));
                
                card.classList.add('active');
                subSkills.classList.add('show');
                
                showSkillDescription(skillId);
            }
        }

                    </div>
                </div>
                <div class="description-content">
                    ${skill.description}
                </div>
                <div class="description-stats">
                    ${Object.entries(skill.stats).map(([key, value]) => `
                        <div class="stat-item">
                            <div class="stat-label">${key}</div>
                            <div class="stat-value">${value}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function showSubSkillDescription(skillId, subIndex) {
            const skill = skillsData.find(s => s.id === skillId);
            const subSkill = skill.subSkills[subIndex];
            const descCard = document.getElementById('descriptionCard');
            
            descCard.innerHTML = `
                <div class="description-header">
                    <div class="description-icon">${subSkill.icon}</div>
                    <div class="description-title">
                        <h2>${subSkill.name}</h2>
                        <div class="description-level">Passif - ${skill.name}</div>
                    </div>
                </div>
                <div class="description-content">
                    ${subSkill.description}
                </div>
                <div class="description-stats">
                    ${Object.entries(subSkill.stats).map(([key, value]) => `
                        <div class="stat-item">
                            <div class="stat-label">${key}</div>
                            <div class="stat-value">${value}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function showEmptyState() {
            const descCard = document.getElementById('descriptionCard');
            descCard.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🎯</div>
                    <div class="empty-state-text">Sélectionnez une compétence pour voir les détails</div>
                </div>
            `;
        }

        createSkillCards();
    </script>
</body>
</html>
