<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statistiques de l'Ombre - SLA Style</title>
    <link rel="stylesheet" href="css/fusion.css"/>
    <link rel="shortcut icon" href="img/Icon/20x20.png" />
    <script src="js/components.js"></script>
    <script src="js/text-formatter.js"></script>
  </head>
  <body>
    <main>  
      <div class="sla-card">
          <div id="shadow-card-header" class="card-header-bar" style="background: linear-gradient(90deg, #2c3e50, #000);">
              <div id="shadow-name-display" class="card-title">Chargement...</div>
              <div id="shadow-rarity-display" class="card-rarity">...</div>
          </div>
          <div class="card-body">
              <div class="card-visual">
                  <img id="shadow-img-display" src="" alt="Image de l'ombre" />
              </div>
              <div class="card-info">
                  <div class="stars-container" id="shadow-stars-container">
                      <span class="stars-label">Rang :</span>
                      <div class="stars">
                        <span class="star" data-value="1">★</span>
                      </div>
                  </div>
                  <div class="skill-box">
                      <div class="skill-header">
                          <span class="skill-title">Effet de l'ombre</span>
                          </div>
                      <div id="shadow-message" class="skill-content"></div>
                  </div>
              </div>
          </div>
      </div>

      <div class="sla-card" style="margin-top: 20px;">
          <div id="weapon-card-header" class="card-header-bar" style="background: linear-gradient(90deg, #8e44ad, #000);">
              <div id="weapon-name-display" class="card-title">Chargement...</div>
              <div id="weapon-rarity-display" class="card-rarity">...</div>
          </div>
          <div class="card-body">
              <div class="card-visual">
                  <img id="weapon-img-display" src="" alt="Arme de l'ombre" />
              </div>
              <div class="card-info">
                  <div class="stars-container" id="weapon-stars-container">
                      <span class="stars-label">Avancement :</span>
                      <div class="stars">
                        <span class="star" data-value="1">★</span>
                      </div>
                  </div>
                  <div class="skill-box">
                      <div class="skill-header">
                          <span class="skill-title">Effet de l'arme</span>
                      </div>
                      <div id="weapon-message" class="skill-content"></div>
                  </div>
              </div>
          </div>
      </div>
    </main>
    <script src="js/data_shadows.js"></script>
    <script src="js/logic-ombres.js"></script>
  </body>
</html>
