<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tawata Kanae - Dokkan Style</title>
    <link rel="stylesheet" href="../../../css/all.css"/>
    
    <style>
      /* --- DOKKAN BATTLE STYLE THEME --- */
      body {
          background-color: #000; /* Fond noir du site */
          color: #fff;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      /* Le conteneur principal de la "Carte" */
      .dokkan-card {
          max-width: 1000px;
          margin: 20px auto;
          background-color: #101010; /* Gris très foncé */
          border: 2px solid #444;
          box-shadow: 0 0 15px rgba(0,0,0,0.8);
          display: flex;
          flex-direction: column;
      }

      /* En-tête de la carte (Nom du perso) */
      .card-header-bar {
          background: linear-gradient(90deg, #2c3e50, #000); /* Dégradé sombre style SSR/UR */
          padding: 10px 20px;
          border-bottom: 2px solid #555;
          display: flex;
          justify-content: space-between;
          align-items: center;
      }

      .card-title {
          font-size: 1.5rem;
          font-weight: bold;
          text-transform: uppercase;
          color: #fff;
          text-shadow: 2px 2px 0 #000;
      }

      .card-rarity {
          color: #f1c40f;
          font-weight: bold;
          font-size: 1.2rem;
      }

      /* Corps de la carte (Image + Infos) */
      .card-body {
          display: flex;
          flex-wrap: wrap;
          padding: 15px;
          gap: 20px;
      }

      /* Colonne Image (Gauche) */
      .card-visual {
          flex: 0 0 300px; /* Largeur fixe pour l'image */
          display: flex;
          flex-direction: column;
          align-items: center;
      }

      .card-visual img {
          width: 100%;
          border: 3px solid #333;
          border-radius: 5px;
      }

      /* Colonne Infos (Droite) */
      .card-info {
          flex: 1; /* Prend le reste de la place */
          display: flex;
          flex-direction: column;
      }

      /* --- STYLE DES ÉTOILES (Style Onglets) --- */
      .stars-container {
          background-color: #222;
          padding: 10px;
          border-radius: 5px 5px 0 0;
          border: 1px solid #444;
          border-bottom: none;
          display: flex;
          align-items: center;
          gap: 10px;
      }

      .stars-label {
          font-weight: bold;
          color: #bbb;
          margin-right: 10px;
          text-transform: uppercase;
          font-size: 0.9rem;
      }

      .stars {
          font-size: 2rem;
          cursor: pointer;
          user-select: none;
          line-height: 1;
      }

      .star {
          color: #444; /* Gris foncé inactif */
          transition: transform 0.1s;
      }
      .star.filled {
          color: #f1c40f; /* Jaune Dokkan */
          text-shadow: 0 0 5px #f39c12;
      }
      .star:hover {
          transform: scale(1.2);
      }

      /* --- BOITE DE COMPÉTENCE (Style Dokkan) --- */
      .skill-box {
          background-color: #1a1a1a;
          border: 1px solid #444;
          border-top: 2px solid #f39c12; /* Ligne orange typique Dokkan */
          padding: 0;
          min-height: 300px; /* Hauteur min pour éviter les sauts */
      }

      .skill-header {
          background-color: #2c2c2c;
          padding: 8px 15px;
          font-weight: bold;
          color: #f39c12; /* Titre en orange/jaune */
          border-bottom: 1px solid #444;
          text-transform: uppercase;
          font-size: 0.9rem;
      }

      .skill-content {
          padding: 15px;
          font-size: 0.95rem;
          line-height: 1.6;
          color: #ddd;
      }

      /* --- MISE EN FORME INTERNE (Buffs, etc.) --- */
      .buff { font-weight: bold; padding: 0 3px; border-radius: 3px; }
      .buff.pourpre { color: #d48df0; } 
      .buff.ecarlate { color: #ff6b6b; } 
      .buff.feu { color: #ff9f43; }      
      .buff.instinct { color: #54a0ff; }
      .buff.sixieme { color: #feca57; }
      .stat-boost { color: #2ecc71; font-weight: bold; }

      /* Sous-boites (Détails) */
      .detail-box {
          background-color: #252525;
          margin-top: 10px;
          border: 1px solid #3a3a3a;
          padding: 10px;
          border-left: 3px solid #777;
      }
      .detail-box:nth-of-type(1) { border-left-color: #d48df0; }
      .detail-box:nth-of-type(2) { border-left-color: #ff6b6b; }
      .detail-box:nth-of-type(3) { border-left-color: #ff9f43; }

      .detail-box h4 { margin: 0 0 5px 0; color: #fff; font-size: 1em;}
      .detail-box p { margin: 0; font-size: 0.9em; color: #ccc;}
      .detail-box small { display: block; margin-top: 5px; color: #777; font-size: 0.8em; }

      /* --- MOBILE --- */
      @media (max-width: 768px) {
          .card-body { flex-direction: column; }
          .card-visual { flex: auto; width: 100%; }
      }
    </style>
  </head>
  <body>
    <header style="padding: 20px; text-align: center;">
      <nav>
        <a href="../../../index.html" style="color: #fff; margin-right: 15px;">Accueil</a>
        <a href="../../../chasseurs.html" style="color: #fff;">Chasseurs</a>
      </nav>  
    </header> 

    <main>  
      
      <div class="dokkan-card">
          
          <div class="card-header-bar">
              <div class="card-title">Tawata Kanae</div>
              <div class="card-rarity">SSR</div>
          </div>

          <div class="card-body">
              
              <div class="card-visual">
                  <img src="Tawata_kanae_art.png" alt="Tawata Kanae" />
                  </div>

              <div class="card-info">
                  
                  <div class="stars-container">
                      <span class="stars-label">Évolution :</span>
                      <div class="stars">
                        <span class="star" data-value="1">★</span><span class="star" data-value="2">★</span><span class="star" data-value="3">★</span><span class="star" data-value="4">★</span><span class="star" data-value="5">★</span>
                      </div>
                  </div>

                  <div class="skill-box">
                      <div class="skill-header">Skill Passive / Effet d'évolution</div>
                      <div id="message" class="skill-content">
                          </div>
                  </div>

              </div>
          </div>
      </div>

    </main>
    
    <footer>
      <p style="text-align: center; color: #555; margin-top: 20px;">&copy; 2025 Solo Leveling Arise Database</p>
      <script src="Tawata_kanae.js"></script>
    </footer>
  </body>
</html>
