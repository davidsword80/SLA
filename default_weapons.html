<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base de données Armes - SLA Style</title>
    <link rel="stylesheet" href="css/fusion.css"/>
    <script src="js/components.js"></script>
    <link rel="shortcut icon" href="img/Icon/20x20.png" />
  </head>
  <body>
    <main>  
      <div class="sla-card">
          <div id="card-header" class="card-header-bar">
              <div style="display: flex; align-items: center;">
                  <div id="weapon-name-display" class="card-title">Chargement...</div>
                  <img id="weapon-element-display" src="" alt="Élément" style="height: 28px; margin-left: 10px; display: none;">
              </div>
              <img id="weapon-rarity-img-display" src="" alt="Rareté Arme" style="height: 35px; display: none;">
          </div>
          <div class="card-body">
              <div class="card-visual">
                  <img id="weapon-img-display" src="" alt="Arme" />
              </div>
              <div class="card-info">
                  <div class="stars-container" id="weapon-stars-container">
                      <span class="stars-label">Avancement :</span>
                      <div class="stars">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                      </div>
                  </div>
                  <div class="skill-box">
                      <div class="skill-header">
                          <span class="skill-title">Effet de l'arme</span>
                          <button id="toggleBtn" class="system-btn">Mode Résumé</button>
                      </div>
                      <div id="weapon-message" class="skill-content"></div>
                  </div>
              </div>
          </div>
      </div>
    </main>
    <script src="js/text-formatter.js"></script>
    <script src="js/data_weapons_dark.js"></script>
    <script src="js/data_weapons_wind.js"></script>
    <script src="js/data_weapons_fire.js"></script>
    <script src="js/data_weapons_light.js"></script>
    <script src="js/data_weapons_water.js"></script>    
    <script src="js/logic-armes.js"></script>
  </body>
</html>
