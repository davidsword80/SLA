<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de données Chasseurs - SLA Style</title>
    <link rel="stylesheet" href="css/fusion.css">
    <link rel="shortcut icon" href="img/Icon/20x20.png" />    
    <script src="js/components.js"></script>
</head>
<body>
    <main>
        <div class="sla-card">
            <div id="char-header" class="card-header-bar">
                <div style="display: flex; align-items: center;">
                    <div id="char-name-display" class="card-title">Chargement...</div>
                    <img id="char-element-display" src="" alt="Élément" style="height: 28px; margin-left: 10px; display: none;">
                </div>
                <img id="char-rarity-img-display" src="" alt="Rareté Chasseur" style="height: 35px; display: none;">
            </div>
            <div class="card-body">
                <div class="card-visual">
                    <img id="char-img-display" src="" alt="Chasseur">
                </div>
                <div class="card-info">
                    <div class="stars-container" id="char-stars-container">
                        <span class="stars-label">Évolution :</span>
                        <div class="stars">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                    </div>
                    <div class="skill-box">
                        <div class="skill-header">
                            <span class="skill-title">Compétence Passive</span>
                            <button id="toggleCharBtn" class="system-btn">Mode Résumé</button>
                        </div>
                        <div id="char-message" class="skill-content"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="sla-card" style="margin-top: 40px;">
            <div id="weapon-header" class="card-header-bar">
                <div id="weapon-name-display" class="card-title">Arme : ...</div>
                <img id="weapon-rarity-img-display" src="" alt="Rareté Arme" style="height: 35px; display: none;">
            </div>
            <div class="card-body">
                <div class="card-visual">
                    <img id="weapon-img-display" src="" alt="Arme">
                </div>
                <div class="card-info">
                    <div class="stars-container" id="weapon-stars-container">
                        <span class="stars-label">Avancement :</span>
                        <div class="stars">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                        </div>
                    </div>
                    <div class="skill-box">
                        <div class="skill-header">
                            <span class="skill-title">Effet de l'arme</span>
                            </div>
                        <div id="weapon-message" class="skill-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/text-formatter.js"></script>
    <script src="js/data_hunters_water.js"></script>
    <script src="js/data_hunters_fire.js"></script>
    <script src="js/data_hunters_dark.js"></script>
    <script src="js/data_hunters_wind.js"></script>
    <script src="js/data_hunters_light.js"></script>
    <script src="js/logic-chasseurs.js"></script>
</body>
</html>
