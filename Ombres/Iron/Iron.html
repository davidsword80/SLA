<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iron - SLA Style</title>
    <link rel="stylesheet" href="../../css/all.css"/>
  </head>
  <body>
    <header>
      <h1>Statistiques de Iron</h1>
      <nav>
        <ul>
            <li><a href="../../index.html">Accueil</a></li>
            <li><a href="../../ombre.html">Ombre</a></li>
        </ul>
      </nav>  
    </header> 
    <main>  
      <div class="sla-card">
          <div class="card-header-bar" style="background: linear-gradient(90deg, #2c3e50, #000);">
              <div class="card-title">Ombre : Iron</div>
              <div class="card-rarity">Grand Maréchal</div>
          </div>
          <div class="card-body">
              <div class="card-visual">
                  <img src="Iron.png" alt="Iron" />
              </div>
              <div class="card-info">
                  <div class="stars-container" id="shadow-stars-container">
                      <span class="stars-label">Rang :</span>
                      <div class="stars">
                        <span class="star" data-value="1">★</span>
                      </div>
                  </div>
                  <div class="skill-box">
                      <div class="skill-header">
                          <span class="skill-title">Effet de l'ombre</span>
                      </div>
                      <div id="shadow-message" class="skill-content"></div>
                  </div>
              </div>
          </div>
      </div>

      <div class="sla-card" style="margin-top: 20px;">
          <div class="card-header-bar" style="background: linear-gradient(90deg, #8e44ad, #000);">
              <div class="card-title">Arme : Le souhait du gardien (Reproduction)</div>
              <div class="card-rarity">Arme d'ombre</div>
          </div>
          <div class="card-body">
              <div class="card-visual">
                  <img src="Le_souhait_du_gardien_reproduction.png" alt="Le souhait du gardien" />
              </div>
              <div class="card-info">
                  <div class="stars-container" id="weapon-stars-container">
                      <span class="stars-label">Avancement :</span>
                      <div class="stars">
                        <span class="star" data-value="1">★</span>
                      </div>
                  </div>
                  <div class="skill-box">
                      <div class="skill-header">
                          <span class="skill-title">Effet de l'arme</span>
                          <button id="toggleBtn" class="system-btn">Mode Résumé</button>
                      </div>
                      <div id="weapon-message" class="skill-content"></div>
                  </div>
              </div>
          </div>
      </div>
    </main>
    <footer>
      <p>&copy; 2025 Solo Leveling Arise Database</p>
      <script src="Iron.js"></script>
    </footer>
  </body>
</html>
