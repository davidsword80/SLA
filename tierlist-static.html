<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Tier List Statique</title>
    <link rel="shortcut icon" href="img/Icon/20x20.png" />
    <style>
      body {
        background-color: #1e1e1e;
        font-family: Arial, sans-serif;
        color: white;
        padding: 20px;
      }

      h1 {
        text-align: center;
      }

      .tier-list {
        max-width: 800px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .tier {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        background-color: #2c2c2c;
        border-radius: 5px;
      }

      .tier-label {
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        border-radius: 5px;
      }

      .tier-S {
        background-color: #ff5555;
      }
      .tier-A {
        background-color: #ffaa00;
      }
      .tier-B {
        background-color: #00aaff;
      }

      .tier-content {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        flex: 1;
        align-items: center;
      }

      .item {
        background-color: #444;
        border-radius: 5px;
        overflow: hidden;
      }
      
      .item img {
        width: 80px;
        height: 80px;
        object-fit: cover;
        display: block;
      }
      
      .tier-icon {
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Ma Tier List</h1>

    <div class="tier-list">
      <div class="tier">
        <div class="tier-label tier-S">
          <!-- Remplacement du texte "S" par une image -->
          <img class="tier-icon" src="https://via.placeholder.com/60x60/ff5555/ffffff?text=S" alt="Tier S">
        </div>
        <div class="tier-content">
          <div class="item">
            <img src="../img/Personnage_icon/Amamiya_mirei.png" alt="Amamiya Mirei" />
          </div>
          <div class="item">
            <img src="../img/Personnage_icon/Anna_ruiz.png" alt="Anna Ruiz" />
          </div>
        </div>
      </div>

      <div class="tier">
        <div class="tier-label tier-A">A</div>
        <div class="tier-content">
          <div class="item"><img src="../img/Personnage_icon/Thomas_andre.png" alt="Thomas Andre"></div>
          <div class="item"><img src="../img/Personnage_icon/Tawata_kanae.png" alt="Tawata Kanae"></div>
          <div class="item"><img src="../img/Personnage_icon/Shimizu_akari.png" alt="Shimizu Akari"></div>
          <div class="item"><img src="../img/Personnage_icon/Thomas_andre.png" alt="Thomas Andre"></div>
          <div class="item"><img src="../img/Personnage_icon/Tawata_kanae.png" alt="Tawata Kanae"></div>
          <div class="item"><img src="../img/Personnage_icon/Shimizu_akari.png" alt="Shimizu Akari"></div>          
        </div>
      </div>

      <div class="tier">
        <div class="tier-label tier-B">B</div>
        <div class="tier-content">
          <div class="item"><img src="../img/Personnage_icon/Choi_jongin.png" alt="Choi Jongin"></div>
          <div class="item"><img src="../img/Personnage_icon/Esil_radir.png" alt="Esil Radir"></div>
        </div>
      </div>
    </div>
  </body>
</html>
